[package]
name = "arcade-tools-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Verified per-user installation and lifecycle management for the Arcade apps"

[workspace]
members = ["."]
resolver = "2"

[dependencies]
arcade-link = { path = "../Arcade-link/crates/arcade-link", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
tempfile = "3"
directories = "6"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
codegen-units = 1
lto = true
strip = true


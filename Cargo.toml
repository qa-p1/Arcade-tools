[package]
name = "arcade-tools-core"
version = "0.3.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Verified per-user installation and lifecycle management for the Arcade apps"

[workspace]
members = [".", "src-tauri", "crates/arcade-shortcuts", "crates/arcade-tools-overlay"]
default-members = [".", "src-tauri"]
resolver = "2"

[dependencies]
# Released Link installer, engines and tray contracts. To build
# against a local checkout instead, add to .cargo/config.toml (not committed):
#   [patch."https://github.com/qa-p1/Arcade-Link"]
#   arcade-link = { path = "<path to>/Arcade-link/crates/arcade-link" }
arcade-link = { git = "https://github.com/qa-p1/Arcade-Link", rev = "3bbbc5d0d7d383e18c7e7e20552e942c1a971abd", features = ["watch", "install", "engines", "trayhost"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
tempfile = "3"
directories = "6"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
semver = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
wait-timeout = "0.2"
regex = "1"
base64 = "0.22"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.35", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

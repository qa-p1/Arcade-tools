[package]
name = "arcade-tools-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Verified per-user installation and lifecycle management for the Arcade apps"

[workspace]
members = [".", "src-tauri"]
default-members = [".", "src-tauri"]
resolver = "2"

[dependencies]
# Arcade Link (the shared protocol), pinned to a release tag. To build
# against a local checkout instead, add to .cargo/config.toml (not committed):
#   [patch."https://github.com/qa-p1/Arcade-Link"]
#   arcade-link = { path = "<path to>/Arcade-link/crates/arcade-link" }
arcade-link = { git = "https://github.com/qa-p1/Arcade-Link", tag = "v0.1.0", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
tempfile = "3"
directories = "6"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

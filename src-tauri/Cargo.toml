[package]
name = "arcade-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Install and update the Arcade apps"
default-run = "arcade-tools"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
arcade-tools-core = { path = ".." }
arcade-link = { path = "../../Arcade-link/crates/arcade-link", features = ["watch"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "arcade-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Install and update the Arcade apps"
default-run = "arcade-tools"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Compile the Windows/macOS renderer on Linux without running a desktop tray.
native-tray-check = ["tauri/tray-icon"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
resvg = { version = "0.45", default-features = false }

[dependencies]
arcade-tools-core = { path = ".." }
# The orchestrator pins the integration branch to v0.3.0 at merge.
arcade-link = { git = "https://github.com/qa-p1/Arcade-Link", branch = "arcade/tools-hub", features = ["watch", "install", "trayhost"] }
arcade-shortcuts = { path = "../crates/arcade-shortcuts" }
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.7"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
webkit2gtk = { version = "2", features = ["v2_16"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "arcade-tools"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Install and update the Arcade apps"
default-run = "arcade-tools"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Compile the Windows/macOS renderer on Linux without running a desktop tray.
native-tray-check = ["tauri/tray-icon"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
resvg = { version = "0.45", default-features = false }

[dependencies]
arcade-tools-core = { path = ".." }
# Shared tray and installer contracts are pinned to the released Link tag.
arcade-link = { git = "https://github.com/qa-p1/Arcade-Link", rev = "2fc7c91b7578ca424264627b82174bedc176e511", features = ["watch", "install", "trayhost"] }
arcade-shortcuts = { path = "../crates/arcade-shortcuts" }
arcade-tools-overlay = { path = "../crates/arcade-tools-overlay" }
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
webkit2gtk = { version = "2", features = ["v2_16"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }


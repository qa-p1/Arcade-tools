[package]
name = "arcade-tools-overlay"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "An on-demand native shortcut sheet for Arcade Tools"

[dependencies]
arcade-shortcuts = { path = "../arcade-shortcuts", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
fs2 = "0.4"
getrandom = "0.3"
interprocess = "2.4"
global-hotkey = "0.8"
cosmic-text = { version = "0.15", default-features = false, features = ["std", "swash", "fontconfig"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "x11-dlopen"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = { version = "0.31", features = ["system"] }
x11rb = { version = "0.13", features = ["xkb"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSWorkspace", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

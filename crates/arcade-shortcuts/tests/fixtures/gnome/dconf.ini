[desktop/wm/keybindings]
close=['<Alt>F4']
switch-windows=['<Alt>Tab']
disabled=['disabled']

[settings-daemon/plugins/media-keys]
audio-settings=['<Control><Alt>v']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']

[settings-daemon/plugins/media-keys/custom-keybindings/custom0]
name='Owner\'s terminal'
binding='<Primary><Super>t'
command='foot --app-id=custom-terminal'

[settings-daemon/plugins/media-keys/custom-keybindings/stale]
name='Removed shortcut'
binding='<Super>z'
command='stale-command'

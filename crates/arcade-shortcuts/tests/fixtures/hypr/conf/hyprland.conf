$mod = SUPER
$terminal = foot
$part = ./parts
source = $part/*.conf

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod SHIFT, 1, movetoworkspace, 1
submap = resize
bindde = , R, Grow window, resizewindow, 10, 0
bind = , Escape, submap, reset
submap = reset
bind = $mod, X, exec, discarded
unbind = $mod, X

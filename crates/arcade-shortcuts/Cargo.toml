[package]
name = "arcade-shortcuts"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Prebuilt shortcut index and sandboxed Hyprland sources for Arcade Tools"

[dependencies]
mlua = { version = "0.12", features = ["lua55", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
directories = "6"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

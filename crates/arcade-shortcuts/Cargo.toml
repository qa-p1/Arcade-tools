[package]
name = "arcade-shortcuts"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Prebuilt shortcut index and sandboxed Hyprland sources for Arcade Tools"

[features]
default = ["builder"]
builder = ["dep:mlua", "dep:glob", "dep:tempfile", "dep:jiff"]

[dependencies]
mlua = { version = "0.12", features = ["lua55", "vendored"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = { version = "0.3", optional = true }
directories = "6"
tempfile = { version = "3", optional = true }
# Lua's os.time and os.date in the sandbox (chrono is unmaintained, RUSTSEC-2026-0543).
jiff = { version = "0.2", optional = true }

[[example]]
name = "dump"
required-features = ["builder"]

[[test]]
name = "fixtures"
required-features = ["builder"]

[[test]]
name = "desktop_readers"
required-features = ["builder"]

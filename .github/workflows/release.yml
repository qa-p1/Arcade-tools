name: Release

# Builds every platform once from a release-candidate tag and publishes the files as a hidden prerelease on the test
# channel (Link's reusable publish: arcade-release.json + an unsigned manifest.json). "Tag a release" starts it; it
# can also be run by hand on an rc tag. Every exit gate runs against those published files; "Promote" then
# republishes the same bytes as stable with a signed manifest. Nothing here publishes stable.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # Keep all source/overlay checks. The bundle matrix below runs every
      # installer, maintenance and resident gate on the actual LTO packages.
      skip_packages: true

  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag is this version's release candidate
        id: release
        run: |
          version="$(python3 scripts/check-versions.py --print)"
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$GITHUB_REF" == refs/tags/* && "$tag" =~ ^v${version//./\\.}-rc\.[1-9][0-9]*$ ]] \
            || { echo "::error::run Release on a tag v$version-rc.N (got $GITHUB_REF)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bundle:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: Arcade-tools
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: Arcade-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - name: Both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@v7
        with:
          node-version-file: Arcade-tools/.nvmrc
          cache: npm
          cache-dependency-path: Arcade-tools/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb dbus-x11 desktop-file-utils xdotool && break
            sleep $((i * 15))
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        timeout-minutes: 5
      - run: npm run typecheck
      - name: Refresh the stable documentation snapshot
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/docs-snapshot.py --keep-bundled --self-version "${{ needs.prepare.outputs.version }}"
          python3 scripts/docs-snapshot.py --check-links src-tauri/resources/docs
      - name: Build the packaged native shortcut overlay
        run: python scripts/prepare-overlay.py --target ${{ matrix.target }}
      - name: Bundle using the OS webview
        env:
          # Use the host libwayland-client; Ubuntu's copy breaks EGL on newer distributions.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: 'libwayland-client.so*;libxkbcommon.so*'
        # Tauri downloads its bundler tools (NSIS, linuxdeploy) on a cold cache with one attempt; GitHub's release
        # downloads return 504 at times. A retry reuses the finished build, so it only repeats the bundling.
        run: |
          for i in 1 2 3; do
            npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} && exit 0
            [ "$i" = 3 ] || sleep $((i * 30))
          done
          exit 1
      - name: Verify the exact release install and uninstall
        run: python3 scripts/verify-package.py --target ${{ matrix.target }}
      - name: Notices cover the bundled native libraries
        if: runner.os == 'Linux'
        run: python3 scripts/native-notices.py --check target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
      - name: Verify automatic repairs in the exact published AppImage
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/verify-maintenance.py target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
      - name: Verify closing windows never restarts the published app
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/verify-resident.py target/${{ matrix.target }}/release/bundle/appimage/*.AppImage arcade.tools
      - name: Stage the installer
        run: |
          mkdir -p target/release-files
          for f in target/${{ matrix.target }}/release/bundle/*/*.{AppImage,exe,dmg}; do
            if [ -f "$f" ]; then cp "$f" "target/release-files/$(basename "$f" | tr ' ' '-')"; fi
          done
          ls target/release-files
          [ "$(ls target/release-files | wc -l)" = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: Arcade-tools/target/release-files/*
          if-no-files-found: error

  publish:
    needs: [prepare, bundle, ci]
    permissions:
      contents: write
    uses: qa-p1/Arcade-Link/.github/workflows/app-publish.yml@v1.0.5
    with:
      app: arcade.tools
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: test
      link-ref: v1.0.5

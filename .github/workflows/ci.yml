name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: Arcade-tools
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: Arcade-tools
      # Owner action before publishing: create this repo and pin a tagged Link
      # dependency. Until then the sibling checkout matches local path deps.
      - uses: actions/checkout@v4
        with:
          repository: qa-p1/Arcade-link
          ref: 07d7781d949ab070ed0a668fe990e49443b82533
          path: Arcade-link
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Arcade-tools/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies and isolation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf xvfb dbus-x11 xdotool
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: python3 scripts/ui-size.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Standalone suite in a disposable desktop session
        if: runner.os == 'Linux'
        run: CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" python3 ../Arcade-link/tools/e2e.py run -- cargo test --workspace --locked
      - name: Platform and release logic (build only)
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

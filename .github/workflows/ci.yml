name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['*.md']
  pull_request:
    paths-ignore: ['*.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its older run; main, tags and release calls never cancel.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: Arcade-tools
    env:
      PYTHONUTF8: '1'
      # CI packages only gate the PR; release.yml builds the shipped LTO packages.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4
        with:
          path: Arcade-tools
      # Only for tools/e2e.py, the disposable desktop session the tests run
      # in; the crate itself comes from the commit pinned in Cargo.toml.
      - uses: actions/checkout@v4
        with:
          repository: qa-p1/Arcade-Link
          ref: 3bbbc5d0d7d383e18c7e7e20552e942c1a971abd
          path: Arcade-link
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Arcade-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Arcade-tools/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies and isolation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 patchelf desktop-file-utils xvfb dbus-x11 xdotool
      - name: Both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: python3 scripts/ui-size.py
      - run: python3 scripts/verify-vendored.py
      - run: python3 scripts/validate_shortcuts.py docs/user/shortcuts.json
      - run: python3 scripts/test-docs-snapshot.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Standalone suite in a disposable desktop session
        if: runner.os == 'Linux'
        run: CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" python3 ../Arcade-link/tools/e2e.py run -- cargo test --workspace --locked
      - name: Platform and release logic (CI only)
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked
      - name: Build both packaged binaries
        run: python3 scripts/prepare-overlay.py --target ${{ matrix.target }}
      - name: Bundle the actual per-platform installer
        env:
          # Use the host libwayland-client; Ubuntu's copy breaks EGL on newer distributions.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: 'libwayland-client.so*'
        run: npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Package smoke in a disposable profile
        run: python3 scripts/verify-package.py --target ${{ matrix.target }}

  overlay:
    name: Overlay / ${{ matrix.os }} / Rust 1.88
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: Arcade-tools
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: Arcade-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Arcade-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux overlay and isolated render dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev fonts-dejavu-core xvfb xdotool imagemagick
      - run: cargo clippy -p arcade-tools-overlay --all-targets --locked -- -D warnings
      - run: cargo test -p arcade-tools-overlay --locked
      - run: cargo build --release -p arcade-tools-overlay --locked
      - name: Render and lifecycle in a private Xvfb session
        if: runner.os == 'Linux'
        run: python3 crates/arcade-tools-overlay/tests/render_headless.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: overlay-render
          path: Arcade-tools/target/overlay-smoke/*
